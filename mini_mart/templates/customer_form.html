{% extends "base.html" %}
{% block title %}{{ action }} Customer{% endblock %}
{% block content %}
<h2>{{ action }} Customer</h2>
<form method="post" class="card p-3" style="max-width:500px;">
  {% csrf_token %}
  <div class="mb-3"><label class="form-label">Name</label>
    <input type="text" name="name" class="form-control" required>
  </div>
  <div class="mb-3"><label class="form-label">phone_number</label>
    <input type="text" name="phone" class="form-control">
  </div>
  <div class="mb-3"><label class="form-label">Address</label>
    <input type="text" name="address" class="form-control">
  </div>
  <button class="btn btn-primary">{{ action }}</button>
  <a href="{% url 'mini_mart:customer_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
