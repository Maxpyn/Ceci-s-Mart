{% extends "base.html" %}
{% block title %}Delete Product{% endblock %}
{% block content %}
<h2>Delete {{ product.name }}?</h2>
<p>This cannot be undone.</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger">Yes, Delete</button>
  <a href="{% url 'mini_mart:product_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
