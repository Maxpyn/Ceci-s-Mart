{% extends "base.html" %}
{% block title %}{{ action }} Product{% endblock %}
{% block content %}
<h2>{{ action }} Product</h2>
<form method="post" class="card p-3" style="max-width:500px;">
  {% csrf_token %}
  <div class="mb-3"><label class="form-label">Name</label>
    <input type="text" name="name" value="{{ product.name|default:'' }}" class="form-control" required>
  </div>
  <div class="mb-3"><label class="form-label">Cost Price ₦</label>
    <input type="number" step="0.01" name="cost_price" value="{{ product.cost_price|default:'' }}" class="form-control" required>
  </div>
  <div class="mb-3"><label class="form-label">Selling Price ₦</label>
    <input type="number" step="0.01" name="selling_price" value="{{ product.selling_price|default:'' }}" class="form-control" required>
  </div>
  <div class="mb-3"><label class="form-label">Quantity</label>
    <input type="number" name="quantity" value="{{ product.quantity|default:0 }}" class="form-control" required>
  </div>
  <button class="btn btn-primary">{{ action }}</button>
  <a href="{% url 'mini_mart:product_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
