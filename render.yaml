services:
  - type: web
    name: ceci-s-mart
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: 'False'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ceci-s-mart-db
          property: connectionString

databases:
  - name: ceci-s-mart-db
    plan: free