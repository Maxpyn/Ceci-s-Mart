{% extends 'base.html' %}

{% block content %}

<div class="container mt-3">

    <h3 class="mb-3">
        👤 Add New Customer
    </h3>

    <div class="card p-3">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button 
                type="submit"
                class="btn btn-success w-100">
                Save Customer
            </button>

        </form>

    </div>

    <a href="{% url 'mini_mart:customer_list' %}"
       class="btn btn-secondary w-100 mt-3">
        Back to Customers
    </a>

</div>

{% endblock %}
